# Metadados estáticos de cada pasta de dados brutos (data/raw/<pasta>).
# Fonte de cada campo indicada em `source`. TODO = informação que só o pesquisador tem.
# Este arquivo é a ENTRADA do catálogo; data/catalog.yaml é GERADO a partir dele
# (dampid.io.catalog.build_catalog) e dos próprios arquivos.

hardware:
  daq: {model: "NI 9234 (cDAQ1Mod1)", range_v: 5.0, coupling: AC, ac_cutoff_hz: 0.5,
        source: "NI-9234 Specifications (ni.com); arquivos .task do pesquisador"}
  accelerometer: {model: "PCB 352C33", sensitivity_mv: 100.0, unit: g, range: 50.0,
                  mass_kg: 0.0058,
                  source: "sensibilidade: .task (valor configurado, nominal); faixa ±50 g e massa 5,8 g: datasheet PCB 352C33 rev. H"}
  hammer: {model: "PCB 086C03", sensitivity_mv: 2.25, unit: N, range: 2224.0,
           source: "sensibilidade: .task (nominal); faixa ±2224 N pk: pcb.com, modelo 086C03"}
  calibration_certificates: "não existem; sensores calibrados — usar as sensibilidades nominais (pesquisador, 2026-11-20)"

specimens:
