    density_nominal: {value: 2700.0, range: [2660.0, 2810.0], source: "faixa típica de ligas de Al (1xxx a 7xxx); liga TODO"}
  ACRILICO:
    material: PMMA (acrílico)
    geometry: {type: rectangular_bar, L_mm: 301.0, b_mm: 49.4, h_mm: 3.00, source: "Tabela 1 do TCC (D1.3)"}
    density_nominal: {value: 1190.0, range: [1170.0, 1200.0], source: "prompt master §5.1 (C8): PMMA 1180–1200 kg/m³"}
