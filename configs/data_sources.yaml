    material: compósito de fibra de carbono (tubo; layup TODO)
    geometry: {type: tube, L_mm: TODO, D_mm: TODO, t_mm: TODO, source: TODO}
  FIB_VIDRO:
    material: compósito de fibra de vidro (tubo; layup TODO)
    geometry: {type: tube, L_mm: 501.0, D_mm: 13.2, t_mm: TODO, source: "relatório/TCC via prompt master §2.3"}
  PLA_CAVERNA:
    material: PLA impresso (preenchimento/orientação TODO)
    geometry: {type: complex, source: "desenhos nos apêndices do relatório; cotas TODO"}
  PLA_LONGARINA:
    material: PLA impresso (preenchimento/orientação TODO)
    geometry: {type: complex, source: "desenhos nos apêndices do relatório; cotas TODO"}

