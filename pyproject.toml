[project]
name = "dampid"
version = "0.0.1"
description = "Inverse identification of structural damping from impact tests (DampID)"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Kevin Marinho" }]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "matplotlib>=3.8",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "xarray>=2024.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "pre-commit>=3.6",
    "jupyter>=1.0",
    "nbconvert>=7",
    "jupytext>=1.16",
    "ipykernel>=6",
]
# Only needed to *run* the legacy code for characterisation (Phase 0).
legacy = [
    "sympy>=1.12",
    "geneticalgorithm2>=6.8",
    "npTDMS>=1.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dampid"]

[tool.uv]
default-groups = ["dev", "legacy"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["legacy", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]
ignore = ["E741"]  # I (second moment of area) is the standard symbol

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
